
services:
  whatsapp:
    build: .
    container_name: unigestor-whatsapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Sessões persistidas — sobrevivem a restarts e rebuilds
      - ./auth:/app/auth
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    depends_on:
      - flaresolverr
    # Limites de memória (seguro para o Droplet de 1GB)
    mem_limit: 400m
    memswap_limit: 400m
    # Health check
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Resolve o Managed Challenge do Cloudflare (Chrome headless de verdade)
  # pro whatsapp-service usar no login do GerenciaApp — não exposto pra fora
  # da VM, só acessível internamente pelo whatsapp-service via rede do Docker.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: unigestor-flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    mem_limit: 1g
    memswap_limit: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
